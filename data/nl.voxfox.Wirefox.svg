<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d42"/>
      <stop offset="1" stop-color="#14152b"/>
    </linearGradient>
    <linearGradient id="fox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9e4f"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
  </defs>
  <!-- rounded background -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- geometric fox head -->
  <g>
    <!-- ears -->
    <polygon points="30,28 48,52 26,56" fill="url(#fox)"/>
    <polygon points="98,28 80,52 102,56" fill="url(#fox)"/>
    <!-- head -->
    <polygon points="28,52 100,52 86,86 64,104 42,86" fill="url(#fox)"/>
    <!-- white cheeks -->
    <polygon points="42,86 64,104 64,78" fill="#fff3e6" opacity="0.92"/>
    <polygon points="86,86 64,104 64,78" fill="#fff3e6" opacity="0.92"/>
    <!-- nose -->
    <polygon points="58,96 70,96 64,104" fill="#2b2d42"/>
    <!-- eyes -->
    <circle cx="48" cy="68" r="4" fill="#2b2d42"/>
    <circle cx="80" cy="68" r="4" fill="#2b2d42"/>
    <!-- whisker dots -->
    <circle cx="38" cy="78" r="1.8" fill="#2b2d42" opacity="0.55"/>
    <circle cx="34" cy="72" r="1.8" fill="#2b2d42" opacity="0.55"/>
    <circle cx="90" cy="78" r="1.8" fill="#2b2d42" opacity="0.55"/>
    <circle cx="94" cy="72" r="1.8" fill="#2b2d42" opacity="0.55"/>
  </g>
  <!-- wire / link symbol under the fox -->
  <g stroke="#7fd1ff" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M40 114 H62"/>
    <path d="M66 114 H88"/>
  </g>
  <circle cx="36" cy="114" r="4" fill="#7fd1ff"/>
  <circle cx="92" cy="114" r="4" fill="#7fd1ff"/>
</svg>
