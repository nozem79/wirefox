name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile wirefox
      - name: Build .deb
        run: ./build-deb.sh
      - name: Lint package
        run: |
          sudo apt-get update && sudo apt-get install -y lintian
          lintian dist/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: wirefox-deb
          path: dist/*.deb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
