name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext lintian

      - name: Syntax check
        run: python3 -m py_compile wirefox

      - name: Build .deb
        run: ./build-deb.sh

      - name: Lint package
        run: lintian dist/*.deb || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wirefox-deb
          path: dist/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: false
