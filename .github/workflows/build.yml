name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext dpkg lintian
          python3 -m py_compile wirefox
          bash build-deb.sh

      - name: Lint
        run: lintian dist/*.deb || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wirefox-deb
          path: dist/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
