name: build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug
        run: |
          pwd
          ls -la
          which bash
          bash --version

      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext
          bash build-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wirefox-deb
          path: dist/*.deb
